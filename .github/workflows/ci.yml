name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      # Smoke test: run the bundled action end-to-end (input parsing, YAML
      # config validation, dependency resolution) with a fake token against a
      # guaranteed-unresolvable hostname (.invalid TLD, RFC 2606). No real TFE
      # API is reachable, so the action must fail in a controlled way with
      # "1 workspace(s) failed" instead of succeeding or hanging.
      - name: Smoke Test (controlled failure)
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          tfe-token: fake-token-for-smoke-test
          organization-name: smoke-test-org
          tfe-hostname: tfe.invalid
          config: |
            action: create
            workspaces:
              smoke-test:
                variables:
                  environment: smoke

      - name: Assert Controlled Failure
        id: assert
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
          WORKSPACE_ID: ${{ steps.test-action.outputs.workspace-id }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected the action to fail against an unreachable TFE host, got outcome: $OUTCOME"
            exit 1
          fi
          if [ -n "$WORKSPACE_ID" ]; then
            echo "Expected no workspace-id output on failure, got: $WORKSPACE_ID"
            exit 1
          fi
          echo "Action failed in a controlled way as expected."
